name: Build and Push Image

# Version-tagged builds only: triggered by the Release workflow (dispatch with
# a version) or by pushing a v*.*.* tag by hand. amd64 only: the derived
# media pipeline is tuned for Intel VAAPI, and QEMU multi-arch builds are slow.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to tag (e.g. 0.1.2)"
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/seklfreak/flimm

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Job-level so the Sentry step's `if` can see it; the step is skipped
      # entirely until the secret exists.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          ver="$INPUT_VERSION"
          [ -z "$ver" ] && ver="${GITHUB_REF_NAME#v}"
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          echo "Building version $ver"

      # The frontend and the binary that embeds it are built here, the binary by
      # setup-go from go.mod (the toolchain test.yaml tests with), so the image
      # is a binary copy (Dockerfile.release). A golang builder stage would pin
      # its own Go, which Renovate moves independently of go.mod.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Baked into the bundle as import.meta.env.VITE_*: the release version,
      # the Sentry DSN and the Umami analytics endpoint. VITE_SENTRY_DSN and the
      # VITE_UMAMI_* pair are repo *variables* (Settings → Variables), not
      # hardcoded values; leave them unset to build without frontend Sentry and
      # without analytics.
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ env.APP_VERSION }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_UMAMI_URL: ${{ vars.VITE_UMAMI_URL }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        run: |
          npm ci --no-fund --no-audit
          npm run build

      # Sourcemaps are built "hidden" (no sourceMappingURL comment) for upload
      # to Sentry only: set the assets aside for the upload below, then delete
      # the maps so the binary never embeds or serves them.
      - name: Set sourcemaps aside
        run: |
          cp -R frontend/dist/assets fe-sourcemaps
          find frontend/dist -name '*.map' -delete

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${APP_VERSION}" -o archive ./cmd/server

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        run: |
          docker build -f Dockerfile.release -t "$IMAGE:$APP_VERSION" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

      # Register the release in both Sentry projects and mark it deployed to
      # production. The image is live ~1 min after the push (Flux automation),
      # so CI is the deploy signal. Needs the SENTRY_AUTH_TOKEN secret.
      # Commit association powers suspect commits; ignore_missing keeps the
      # first releases green while Sentry has no previous release to diff
      # against.
      - name: Post release + deploy to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: winktech
        with:
          projects: flimm-be flimm-fe
          release: flimm@${{ env.APP_VERSION }}
          environment: production
          set_commits: auto
          ignore_missing: true
          sourcemaps: ./fe-sourcemaps
          url_prefix: "~/assets"
