name: Apple

# The iOS/iPadOS (and later tvOS) clients under apple/. Separate from
# test.yaml so the Go and web jobs keep running on the fast runners and a
# macOS runner is only spent when Apple code actually changes.
on:
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yaml"
  push:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple.yaml"

jobs:
  build:
    # macos-26 for the iOS 26 SDK.
    runs-on: macos-26
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v7

      # Pinned, not `brew install`. Unpinned, a SwiftLint release that adds a
      # rule turns main red on the next push whatever that push contains — and
      # a local binary a version behind lints clean, so nobody sees it coming.
      # That is the same trap the golangci-lint pin in test.yaml closes on the
      # Go side. Renovate keeps both current; see the custom manager in
      # renovate.json, which reads the annotations below.
      - name: Tooling
        env:
          # renovate: datasource=github-releases depName=realm/SwiftLint
          SWIFTLINT_VERSION: "0.65.1"
          # renovate: datasource=github-releases depName=yonaskolb/XcodeGen
          XCODEGEN_VERSION: "2.46.0"
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$tools/swiftlint"
          # xcodegen resolves its settings presets from `share/` beside the
          # binary, so the archive is kept whole rather than the binary copied
          # out of it.
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$tools"
          echo "$tools/swiftlint" >> "$GITHUB_PATH"
          echo "$tools/xcodegen/bin" >> "$GITHUB_PATH"
          # $GITHUB_PATH only reaches later steps, so these say by full path
          # what the rest of the job will be running.
          "$tools/swiftlint/swiftlint" version
          "$tools/xcodegen/bin/xcodegen" --version
          xcodebuild -version

      - name: Generate project
        run: |
          # Placeholder secrets: enough to compile. Real values are injected
          # as build settings only in the TestFlight archive.
          cp Config/Secrets.example.xcconfig Config/Secrets.xcconfig
          xcodegen generate

      - name: SwiftLint
        run: swiftlint lint --strict

      # FlimmKit is pure Foundation, so the suite runs on the host toolchain —
      # no simulator boot needed, and failures point straight at the package.
      - name: FlimmKit tests
        working-directory: apple/FlimmKit
        run: swift test

      - name: Build (iOS Simulator, unsigned)
        run: |
          SIM=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d.values() for x in r if 'iPhone' in x['name']))")
          echo "Using simulator $SIM"
          xcodebuild build \
            -project Flimm.xcodeproj -scheme Flimm \
            -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO

      # `generic/platform` rather than a device id: the runner's tvOS runtime
      # may have no Apple TV simulator created, and the TV target has no
      # device-specific layout to be worth booting one for.
      - name: Build (tvOS Simulator, unsigned)
        run: |
          xcodebuild build \
            -project Flimm.xcodeproj -scheme FlimmTV \
            -destination 'generic/platform=tvOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
