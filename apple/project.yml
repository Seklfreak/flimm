name: Flimm
options:
  bundleIdPrefix: dev.winktech
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  # Everything that is not UI — models, API client, auth, playback state —
  # lives in this local package so the (later) iPadOS and tvOS targets share
  # it verbatim. See docs/apple-apps.md.
  FlimmKit:
    path: FlimmKit
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.26.1
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  Flimm:
    type: application
    platform: iOS
    sources:
      # Platform-neutral app code — the model, paging, formatting, the
      # palette and authenticated images — shared verbatim with FlimmTV.
      # Anything that is *not* UI belongs in FlimmKit instead.
      - Shared
      - Flimm/Sources
      - Flimm/Assets.xcassets
    dependencies:
      - package: FlimmKit
        product: FlimmKit
      - package: Sentry
        product: Sentry
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.flimm
        # Paid Developer Program team — required for TestFlight distribution.
        # Comes from Config/Secrets.xcconfig so the repo carries no team id.
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # 1,2 = iPhone and iPad: the iPad client is the same target with a
        # different navigation container, not a second app.
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        # Manual signing for Release/archives, scoped to the app target only —
        # passing these on the xcodebuild command line applies them to SPM
        # package targets too, which refuse provisioning profiles. Debug (what
        # Xcode runs locally) stays on automatic signing.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Flimm App Store
    info:
      path: Flimm/Info.plist
      properties:
        CFBundleDisplayName: Flimm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # A Flimm server on the same machine or LAN is a normal way to run
        # this — `AUTH_DISABLED=true` on a laptop, or a box with no
        # certificate. This permits cleartext to local hosts only; the public
        # internet still has to be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Split View and Slide Over. The layout switches on the horizontal size
        # class, which iPad multitasking flips mid-flow, so the app has to be
        # willing to be resized at all.
        UIRequiresFullScreen: false
        SENTRY_DSN: $(SENTRY_DSN)
        # Self-hosted Umami analytics, baked in the same way as the Sentry
        # DSN. Empty in the placeholder xcconfig, so local and CI builds
        # report nothing; a server running ANALYTICS_DISABLED=true turns it
        # off for a shipped build too.
        UMAMI_URL: $(UMAMI_URL)
        UMAMI_WEBSITE_ID: $(UMAMI_WEBSITE_ID)
        # Audio-only playback of music playlists keeps running with the screen
        # locked; this is what makes that mode worth having on a phone.
        UIBackgroundModes:
          - audio
        # OIDC redirect target. The provider must allow
        # dev.winktech.flimm://auth as a native redirect URI — a deployment-side
        # configuration step the app surfaces verbatim when sign-in fails.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.winktech.flimm
            CFBundleURLSchemes:
              - dev.winktech.flimm
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  FlimmTV:
    type: application
    platform: tvOS
    sources:
      - Shared
      - FlimmTV/Sources
      - FlimmTV/Assets.xcassets
    dependencies:
      - package: FlimmKit
        product: FlimmKit
      - package: Sentry
        product: Sentry
      # The Home screen's top shelf. Embedded in the app, and the only reason
      # this target has an App Group: the extension runs in another process
      # and can only see what the app leaves in the shared container.
      - target: FlimmTopShelf
    entitlements:
      path: FlimmTV/FlimmTV.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.winktech.flimm
    settings:
      base:
        # A separate record from the phone app: tvOS is its own platform in
        # App Store Connect, and the two ship on their own schedules.
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.flimm.tv
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        # tvOS icons are a layered brand-assets bundle, not an app icon set.
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        # 3 = Apple TV.
        TARGETED_DEVICE_FAMILY: "3"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Flimm TV App Store
    info:
      path: FlimmTV/Info.plist
      properties:
        CFBundleDisplayName: Flimm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # A Flimm server on the same machine or LAN is a normal way to run
        # this — `AUTH_DISABLED=true` on a laptop, or a box with no
        # certificate. This permits cleartext to local hosts only; the public
        # internet still has to be https.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        SENTRY_DSN: $(SENTRY_DSN)
        UMAMI_URL: $(UMAMI_URL)
        UMAMI_WEBSITE_ID: $(UMAMI_WEBSITE_ID)
        # Music playlists play as audio only here too, and a TV keeps playing
        # them with the screen saver up.
        UIBackgroundModes:
          - audio
        # Not for sign-in: tvOS has no ASWebAuthenticationSession and no
        # browser, so the device authorization grant never redirects back
        # here. This scheme exists for the top shelf, whose actions are URLs
        # the system opens in the app — see TopShelfLink.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: dev.winktech.flimm.tv
            CFBundleURLSchemes:
              - dev.winktech.flimm.tv
        UIUserInterfaceStyle: Automatic

  # The top shelf extension: a reader over the snapshot the app writes into
  # the shared container. It has no network, no token and no UI of its own.
  FlimmTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - FlimmTopShelf/Sources
    dependencies:
      - package: FlimmKit
        product: FlimmKit
    entitlements:
      path: FlimmTopShelf/FlimmTopShelf.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.winktech.flimm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.winktech.flimm.tv.topshelf
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "3"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Flimm TV Top Shelf App Store
    info:
      path: FlimmTopShelf/Info.plist
      properties:
        CFBundleDisplayName: Flimm Top Shelf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).TopShelfContentProvider
